# Entorno de DESARROLLO (F0-T08). No usar en producción: la imagen de producción es `Dockerfile`.
# Requiere en .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB y JWT_SECRET (ver .env.example).

services:
  db:
    image: postgres:15
    container_name: saas_db
    restart: always
    env_file:
      - .env
    ports:
      - '3363:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: saas_backend
    init: true
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - NODE_ENV=development
      # Sin valor por defecto: un secreto conocido en el compose acabaría usándose de verdad (H1).
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        pnpm prisma generate &&
        pnpm prisma migrate deploy &&
        pnpm dev
      "
    depends_on:
      db:
        condition: service_healthy

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: saas_studio
    init: true
    ports:
      - '3364:5555'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: >
      sh -c "
        pnpm prisma generate &&
        HOST=0.0.0.0 pnpm prisma studio --port 5555 --browser none
      "
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
